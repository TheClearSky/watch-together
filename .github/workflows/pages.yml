# Builds the app on every PR (the required `build` check) and deploys it to
# GitHub Pages on every push to main. CI is the only deploy path.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      # A newer push to the same PR replaces its older build.
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # A pull request only builds; publishing the site waits for the merge.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy may write to Pages (OIDC-authenticated).
    permissions:
      pages: write
      id-token: write
    # Deploys run one at a time and are never cancelled half-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
